services:
  php-fpm:
    build:
      context: ./docker/php-fpm
      args:
        USER_ID: ${USER_ID:-1000}
        USER_NAME: ${USER_NAME:-www-data}
        GROUP_ID: ${GROUP_ID:-1000}
        GROUP_NAME: ${GROUP_NAME:-www-data}
    volumes:
      - .:/var/www
      - ./docker/php-fpm/php.prod.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./docker/php-fpm/zz-pool.prod.conf:/usr/local/etc/php-fpm.d/zz-pool.conf:ro
    networks:
      - symfony-network
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'OK';"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build: ./docker/nginx
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/sites:/etc/nginx/conf.d:ro
    networks:
      - symfony-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      php-fpm:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    environment:
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:?Set PRIMARY_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - symfony-network
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy

  postgres:
    build: ./docker/postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - symfony-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redis:
    build: ./docker/redis
    volumes:
      - redis_data:/data
    networks:
      - symfony-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  symfony-network:

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
