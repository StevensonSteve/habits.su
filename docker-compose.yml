version: '3.8'

services:
  php-fpm:
    build:
      context: ./docker/php-fpm
    volumes:
      - ${CODE_DIR}:/var/www
      - ./docker/php-fpm/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - symfony-network
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'OK';"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  messenger-async:
    build:
      context: ./docker/php-fpm
    command: php bin/console messenger:consume async -vv
    volumes:
      - ${CODE_DIR}:/var/www
      - ./docker/php-fpm/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - symfony-network
    healthcheck:
      test: ["CMD", "php", "bin/console", "messenger:stats"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      php-fpm:
        condition: service_healthy

  messenger-scheduler:
    build:
      context: ./docker/php-fpm
    command: php bin/console messenger:consume scheduler_default -vv
    volumes:
      - ${CODE_DIR}:/var/www
      - ./docker/php-fpm/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - symfony-network
    healthcheck:
      test: ["CMD", "php", "bin/console", "messenger:stats"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      php-fpm:
        condition: service_healthy

  messenger-weekly-report:
    build:
      context: ./docker/php-fpm
    command: php bin/console messenger:consume scheduler_weekly_order_report -vv
    volumes:
      - ${CODE_DIR}:/var/www
      - ./docker/php-fpm/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - symfony-network
    healthcheck:
      test: ["CMD", "php", "bin/console", "messenger:stats"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      php-fpm:
        condition: service_healthy

  messenger-rabbitmq:
    build:
      context: ./docker/php-fpm
    command: php bin/console messenger:consume async_rabbitmq -vv
    volumes:
      - ${CODE_DIR}:/var/www
      - ./docker/php-fpm/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - symfony-network
    healthcheck:
      test: ["CMD", "php", "bin/console", "messenger:stats"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      php-fpm:
        condition: service_healthy

  nginx:
    build: ./docker/nginx
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ${CODE_DIR}:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/sites:/etc/nginx/conf.d
    networks:
      - symfony-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      php-fpm:
        condition: service_healthy

  postgres:
    build: ./docker/postgres
#    environment:
#      POSTGRES_DB: ${POSTGRES_DB}
#      POSTGRES_USER: ${POSTGRES_USER}
#      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - symfony-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  rabbitmq:
    build: ./docker/rabbitmq
    hostname: rabbitmq
#    environment:
#      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
#      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - symfony-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redis:
    build: ./docker/redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - symfony-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  symfony-network:

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
